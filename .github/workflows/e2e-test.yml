name: E2E Tests
# Thin wrapper around the shared workflow (image pre-pull, caching, readiness wait):
# https://github.com/CruGlobal-AI/ab-workflows/blob/main/.github/workflows/cypress-e2e-tests.yml
on:
   workflow_call:
      inputs:
         ref:
            type: string
            default: ${{ github.ref }}
         app_id:
            description: GitHub App ID for Auth (or client ID)
            type: string
            required: true
      secrets:
         app_secret:
            description: GitHub App client secret for Auth
            required: true

jobs:
   e2e-tests:
      name: Test
      uses: CruGlobal-AI/ab-workflows/.github/workflows/cypress-e2e-tests.yml@main
      with:
         ref: ${{ inputs.ref }}
         config: ab-designer
         build_web: true
         # webpack writes into ../web (or ../../web for plugins)
         checkout_path: plugins/plugin_ABDesigner
         folder: ab
         port: "8080"
         app_id: ${{ inputs.app_id }}
      secrets:
         app_secret: ${{ secrets.app_secret }}
