name: Merging Rules
on:
   # Run on pull requests into the #master branch
   pull_request:
      branches: [master]

jobs:
   unit-tests:
      name: Unit Tests
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v6
         - run: npm i
         - run: npm test

   e2e-tests:
      uses: CruGlobal-AI/ab-workflows/.github/workflows/cypress-e2e-tests.yml@e2e-speedup
      with:
         config: ab-designer
         build_web: true
         checkout_path: plugins/plugin_ABDesigner
         folder: ab
         port: "8080"
         app_id: ${{ vars.DS_GH_APP_ID }}
      secrets:
         app_secret: ${{ secrets.DS_GH_APP_PK }}
